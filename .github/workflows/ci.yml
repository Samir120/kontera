name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  purity:
    name: purity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-purity.sh

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # ---- Stubbed until they have something to check ----
  #
  # deny    cargo-deny needs a deny.toml with the licence allowlist from
  #         docs/07 §6. Written when the first outside dependency lands.
  # audit   cargo-audit is meaningful once Cargo.lock has a real graph;
  #         wire it up alongside deny.
  # wasm    wasm-pack build + the 400 KB gzipped size budget (docs/07 §4.1).
  #         Nothing to measure until M5.
  #
  # macos-latest for the CLI build (docs/07 §3) waits for M4, when there is
  # a CLI to build.
